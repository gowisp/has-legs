<!doctype html>
<html lang="en-ZA" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{site.robots}}
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{page.url}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Has Legs">
<meta property="og:title" content="{{page.og_title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.url}}">
<meta property="og:image" content="{{site.url}}assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F4EFE6">
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
<link rel="preload" href="{{root}}assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}assets/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/css/site.css?v={{v}}">
<script>document.documentElement.className = "js"; setTimeout(function () { if (!window.hasLegsReady) { document.documentElement.className += " no-reveal"; } }, 3000);</script>
</head>
<body class="{{page.body_class}}">
<a class="skip" href="#main">Skip to the content</a>

{{> header.html}}

<main id="main">
{{content}}
</main>

{{> footer.html}}

<script src="{{root}}assets/js/site.js?v={{v}}" defer></script>
{{page.scripts}}
</body>
</html>
