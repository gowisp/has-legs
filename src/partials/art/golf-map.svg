  <!-- key -->
  <circle cx="408" cy="361" r="3.6" fill="#F2B33D"/>
  <text x="416" y="364.5" class="v-sans" font-size="9" fill="#5C6884">Pin</text>
  <rect x="444" y="358" width="6" height="6" fill="#12284C"/>
  <text x="455" y="364.5" class="v-sans" font-size="9" fill="#5C6884">Tee</text>
