      <circle cx="462" cy="154" r="9"/><circle cx="440" cy="264" r="9"/><circle cx="318" cy="314" r="9"/>
      <circle cx="332" cy="216" r="9"/><circle cx="210" cy="204" r="9"/><circle cx="138" cy="300" r="9"/>
    </g>
    <g fill="#F2B33D">
      <circle cx="120" cy="202" r="3.6"/><circle cx="232" cy="124" r="3.6"/><circle cx="350" cy="108" r="3.6"/>
      <circle cx="462" cy="154" r="3.6"/><circle cx="440" cy="264" r="3.6"/><circle cx="318" cy="314" r="3.6"/>
      <circle cx="332" cy="216" r="3.6"/><circle cx="210" cy="204" r="3.6"/><circle cx="138" cy="300" r="3.6"/>
