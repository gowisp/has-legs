      <path d="M68 208v-9"/><circle cx="68" cy="192" r="7"/>
      <path d="M288 158v-9"/><circle cx="288" cy="142" r="7"/>
      <path d="M240 318v-9"/><circle cx="240" cy="302" r="7"/>
      <path d="M258 334v-9"/><circle cx="258" cy="318" r="7"/>
      <path d="M488 318v-9"/><circle cx="488" cy="302" r="7"/>
      <path d="M180 286v-9"/><circle cx="180" cy="270" r="7"/>
