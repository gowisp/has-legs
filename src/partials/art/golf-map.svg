<svg viewBox="0 0 520 380" role="img" aria-label="A course map for the golf day. Nine fairways drawn in the deck's thin navy line, each pin marked with a yellow dot, with hole numbers in the deck's serif.">
  <rect x="1" y="1" width="518" height="378" rx="8" fill="#FBF8F1" stroke="#E2D9C6" stroke-width="1.5"/>
  <circle cx="30" cy="33" r="4.5" fill="#F2B33D"/>
  <text x="42" y="38" class="v-serif" font-size="14" fill="#12284C">Verlane Bank</text>
  <text x="25" y="78" class="v-serif" font-size="31" fill="#12284C">Course map</text>
  <line x1="27" y1="91" x2="83" y2="91" stroke="#F2B33D" stroke-width="3" stroke-linecap="round"/>
  <text x="27" y="110" class="v-sans" font-size="10.5" fill="#5C6884">Client Golf Day, front nine</text>

  <!-- the hills and sun from the title slide -->
  <circle cx="462" cy="34" r="9" fill="#F2B33D"/>
  <path d="M350 62c26 0 40-18 62-13s32 20 54 9 30-12 40-9" fill="none" stroke="#12284C" stroke-width="1.8" stroke-linecap="round"/>

  <g transform="translate(0 14)">
