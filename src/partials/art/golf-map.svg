      <path d="M140 182Q176 132 232 124"/>
      <path d="M256 114Q302 92 350 108"/>
      <path d="M374 118Q432 114 462 154"/>
      <path d="M466 180Q478 228 440 264"/>
      <path d="M420 284Q380 326 318 314"/>
      <path d="M298 298Q290 250 332 216"/>
      <path d="M318 194Q262 168 210 204"/>
      <path d="M198 224Q190 276 138 300"/>
    </g>
    <!-- playing lines -->
    <g fill="none" stroke="#12284C" stroke-width="1.8" stroke-linecap="round">
      <path d="M92 300Q84 244 120 202"/>
      <path d="M140 182Q176 132 232 124"/>
      <path d="M256 114Q302 92 350 108"/>
      <path d="M374 118Q432 114 462 154"/>
      <path d="M466 180Q478 228 440 264"/>
      <path d="M420 284Q380 326 318 314"/>
      <path d="M298 298Q290 250 332 216"/>
      <path d="M318 194Q262 168 210 204"/>
      <path d="M198 224Q190 276 138 300"/>
