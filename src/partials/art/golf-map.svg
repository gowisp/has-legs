      <rect x="89" y="297" width="6" height="6"/><rect x="137" y="179" width="6" height="6"/><rect x="253" y="111" width="6" height="6"/>
      <rect x="371" y="115" width="6" height="6"/><rect x="463" y="177" width="6" height="6"/><rect x="417" y="281" width="6" height="6"/>
      <rect x="295" y="295" width="6" height="6"/><rect x="315" y="191" width="6" height="6"/><rect x="195" y="221" width="6" height="6"/>
