  <circle cx="288" cy="104" r="4" fill="#F2B33D"/>
  <text x="298" y="108.500" class="v-serif" font-size="11.500" fill="#12284C">Verlane Bank</text>
  <text x="286" y="152" class="v-serif" font-size="25" fill="#12284C">Your first</text>
