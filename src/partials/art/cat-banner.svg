  <text x="16" y="264" class="v-serif" font-size="24" fill="#FBF8F1">sooner.</text>
  <rect x="142" y="258" width="92" height="26" rx="13" fill="#F2B33D"/>
  <text x="188" y="275" text-anchor="middle" class="v-sans" font-size="10.500" font-weight="700" fill="#12284C">Book your slot</text>

