<section class="call" aria-labelledby="call-title">
  <div class="wrap">
    <h2 id="call-title">Got work that <em>has legs?</em></h2>
    <p class="lede">Send us the reference, your brand guidelines and what you need next. We'll come back with a fixed fee and a time.</p>
    <div class="call-actions">
      <a class="btn" href="{{root}}brief/">
        Send a brief
        {{> icon-arrow.svg}}
      </a>
      <a class="addr" href="mailto:{{site.email}}">{{site.email}}</a>
    </div>
  </div>
</section>
